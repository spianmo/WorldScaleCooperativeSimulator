[package]
name = "world_scale_aligned_cooperative_objective_solution"
version = "0.1.0"
description = "Physical world scale aligned cooperative objective simulator"
authors = ["Teamhelper"]
edition = "2021"

[lib]
name = "world_scale_aligned_cooperative_objective_solution_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-geolocation = "2"
tokio = { version = "1", features = ["fs", "sync", "rt-multi-thread", "macros"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
filetime = "0.2"
