[package]
name = "world_scale_aligned_cooperative_objective_solution"
version = "0.1.0"
description = "Physical world scale aligned cooperative objective simulator"
authors = ["Teamhelper"]
edition = "2021"

[lib]
name = "world_scale_aligned_cooperative_objective_solution_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
